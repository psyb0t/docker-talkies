openapi: 3.1.0
info:
  title: talkies
  description: "OpenAI-compatible speech wrapper \u2014 /v1/audio/transcriptions over\
    \ Whisper / Parakeet / Canary ASR + /v1/audio/speech over Kokoro TTS. Lazy-loads\
    \ models on first request, idle-unloads after TALKIES_MODEL_TTL."
  version: 0.18.0
paths:
  /healthz:
    get:
      tags:
      - Service
      summary: Check service health
      description: Check that Talkies is responding and see its device and configured
        model IDs.
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /v1/models:
    get:
      tags:
      - Models
      summary: List available models
      description: Return model IDs, capabilities and concurrency limits. Select a
        transcription or speech model by its ID in the corresponding request.
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Models V1 Models Get
  /v1/audio/voices:
    get:
      tags:
      - Speech
      summary: List speech voices
      description: "List available TTS voices across all loaded TTS models.\n\nReturned\
        \ shape: ``{\"voices\": [{\"voice\": str, \"model\": str,\n\"default\": bool,\
        \ \"origin\": str?}]}``. Pass any ``voice`` value to\n``POST /v1/audio/speech``\
        \ together with its ``model`` slug \u2014 voices\nare not interchangeable\
        \ across models (each TTS engine owns its own\ncatalog).\n\n``origin`` is\
        \ set to ``\"builtin\"`` (shipped in the image) or\n``\"custom\"`` (mounted\
        \ via ``/data/custom-voices/``) for backends that\nexpose a ``voice_origins()``\
        \ method; omitted otherwise."
      operationId: list_voices_v1_audio_voices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Voices V1 Audio Voices Get
  /api/ps:
    get:
      tags:
      - Models
      summary: List loaded models
      description: Inspect the models currently in memory. The available-models list
        also includes models that can load on demand.
      operationId: list_loaded_api_ps_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Loaded Api Ps Get
  /api/ps/{model_id}:
    delete:
      tags:
      - Models
      summary: Unload a model
      description: Release the loaded model with the given ID. A model with active
        inference requests cannot be unloaded.
      operationId: unload_one_api_ps__model_id__delete
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/unload:
    post:
      tags:
      - Models
      summary: Unload all models
      description: Stop model workers and release their CPU and GPU memory. Workers
        restart on demand.
      operationId: unload_all_v1_unload_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnloadResult'
        '409':
          description: A model is serving active inference or a stream.
  /unload:
    post:
      tags:
      - Models
      summary: Unload all models (legacy)
      description: Use POST /v1/unload for new clients.
      operationId: unload_all_unload_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Unload All Unload Post
      deprecated: true
  /v1/audio/speech:
    post:
      tags:
      - Speech
      summary: Synthesize speech
      description: Turn text into speech using a configured model. Pick a voice from
        that model's voice list. PCM can stream incrementally when the backend supports
        it.
      operationId: speech_v1_audio_speech_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
            example:
              model: kokoro-82m
              input: The recording starts now.
              response_format: wav
        required: true
      responses:
        '200':
          description: Audio in the requested format.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/audio/transcriptions:
    post:
      tags:
      - Transcription
      summary: Transcribe audio
      description: Send a multipart request with either a file upload or a file_path
        containing a staged path or an HTTP(S) URL. Select a transcription model.
        The requested format determines whether the response is JSON, plain text or
        subtitles.
      operationId: transcribe_v1_audio_transcriptions_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_v1_audio_transcriptions_post'
            example:
              model: whisper-large-v3-turbo
              file_path: uploads/interview.wav
              response_format: verbose_json
        required: true
      responses:
        '200':
          description: Transcript or subtitles in the requested response format.
          content:
            text/plain:
              schema:
                type: string
            application/x-subrip:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
            application/json:
              schema:
                type: object
                title: Response Transcribe V1 Audio Transcriptions Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/files:
    get:
      tags:
      - Files
      summary: List staged files
      description: Return the relative paths and sizes of files in the staging area.
      operationId: files_list_v1_files_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Files List V1 Files Get
  /v1/files/{path}:
    put:
      tags:
      - Files
      summary: Upload a staged file
      description: Send the file as raw bytes. Use the relative path from the URL
        as file_path in a later transcription request.
      operationId: files_put_v1_files__path__put
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '201':
          description: Staged file path and size in bytes.
          content:
            application/json:
              schema:
                type: object
                required:
                - path
                - size
                properties:
                  path:
                    type: string
                  size:
                    type: integer
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
    get:
      tags:
      - Files
      summary: Download a staged file
      description: Return the stored bytes for the requested staging path.
      operationId: files_get_v1_files__path__get
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Staged file bytes. Content-Type follows the filename.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Files
      summary: Delete a staged file
      description: Remove the file at the requested staging path. The response identifies
        the deleted file.
      operationId: files_delete_v1_files__path__delete
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_transcribe_v1_audio_transcriptions_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
          description: Audio to upload. Omit when using file_path.
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          title: File Path
          description: Staged path or URL. Omit with a file upload.
        model:
          type: string
          title: Model
          description: ID of a configured transcription model.
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Language hint for models that support it.
        response_format:
          type: string
          title: Response Format
          description: Transcript format such as json, text, srt or vtt.
          default: json
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
          description: Accepted for OpenAI compatibility and ignored.
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          description: Accepted for OpenAI compatibility and ignored.
        timestamp_granularities[]:
          items:
            type: string
          type: array
          title: Timestamp Granularities[]
          description: OpenAI timestamp option. Verbose JSON returns both levels.
          default: []
        diarization:
          anyOf:
          - type: string
          - type: 'null'
          title: Diarization
          description: Set true to transcribe stereo channels separately.
      type: object
      required:
      - model
      title: Body_transcribe_v1_audio_transcriptions_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SpeechRequest:
      properties:
        model:
          type: string
          title: Model
          description: ID of a configured speech model from GET /v1/models.
        input:
          type: string
          title: Input
          description: Text to read aloud.
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
          description: Voice ID for this model. Omit to use its default voice.
        response_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Format
          description: Audio encoding. Use mp3, opus, aac, flac, wav or pcm. The default
            is mp3.
        speed:
          anyOf:
          - type: number
            maximum: 4.0
            minimum: 0.25
          - type: 'null'
          title: Speed
          description: Playback speed multiplier. A value of 1 is normal speed.
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Delivery or style instructions for models that support them.
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Optional spoken language for a backend that accepts it.
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
          description: Sampling temperature for Qwen3 speech.
        top_k:
          anyOf:
          - type: integer
            maximum: 1000.0
            minimum: 1.0
          - type: 'null'
          title: Top K
          description: Maximum number of candidate tokens during Qwen3 sampling.
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Top P
          description: Cumulative probability cutoff for Qwen3 sampling.
        repetition_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.5
          - type: 'null'
          title: Repetition Penalty
          description: Penalty applied to repeated codec tokens by Qwen3.
        max_new_tokens:
          anyOf:
          - type: integer
            maximum: 2048.0
            minimum: 1.0
          - type: 'null'
          title: Max New Tokens
          description: Maximum number of codec tokens produced by Qwen3.
        do_sample:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Do Sample
          description: Use sampling in Qwen3. Set false for greedy decoding.
      type: object
      required:
      - model
      - input
      title: SpeechRequest
      description: 'OpenAI-compatible POST body for ``/v1/audio/speech``.


        ``instructions`` controls speech style for backends that support it

        (Qwen3-TTS: passed as the ``instruct`` parameter to ``generate_voice_clone``;

        works best in ICL mode i.e. when a ``.txt`` transcript exists for the voice).

        Ignored by Kokoro, which has no instruction-prompt input.

        ``speed`` clamped to 0.25-4.0 (matches OpenAI''s documented range).'
    UnloadResult:
      properties:
        unloaded:
          items:
            type: string
          type: array
          title: Unloaded
          description: IDs of the models released by this request.
      type: object
      required:
      - unloaded
      title: UnloadResult
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
