title: talkies
tagline: Self-hosted speech API in one Docker image
description: >-
  Talkies documentation: OpenAI-compatible transcription and text-to-speech,
  live ASR over WebSocket, file staging, model lifecycle and MCP, self-hosted
  in one Docker image.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-talkies
repository: psyb0t/docker-talkies
author: psyb0t

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search_enabled: true
search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-talkies
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-talkies/blob/main/CHANGELOG.md
  - title: Docker Hub
    url: https://hub.docker.com/r/psyb0t/talkies

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/docker-talkies
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
