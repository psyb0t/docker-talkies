[project]
name = "talkies"
version = "0.15.0"
description = "Unified speech service — OpenAI-compatible /v1/audio/transcriptions (Whisper/Parakeet/Canary ASR) + /v1/audio/speech (Kokoro/Qwen3-TTS/Chatterbox TTS) with VAD chunking, stereo diarization, and full Whisper-shape timestamps"
license = { text = "WTFPL" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "psyb0t" }]
keywords = ["asr", "speech-to-text", "whisper", "parakeet", "canary", "nemo", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Lightweight runtime deps only — heavy ML stack (torch + nemo_toolkit[asr])
# installed via Dockerfile because:
#   1. torch flavor (CPU vs CUDA) is chosen by --index-url at install time,
#      can't pin both in one uv.lock
#   2. NeMo's transitive resolution is fragile + slow; we install with explicit
#      pins from the hash-locked requirements file.
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "mcp==1.27.1",
    "sherpa-onnx==1.13.4",
    "vosk==0.3.45",
    "sherpa-onnx-core==1.13.4",
]

[project.urls]
Homepage = "https://github.com/psyb0t/docker-talkies"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkies"]

[tool.uv]
# Supply-chain defense: only install pkg versions older than `exclude-newer`.
# Bumped by `make pkg-*` targets before any dep mutation. UTC midnight.
exclude-newer = "2026-07-22T00:00:00Z"

[tool.mypy]
# The dev/lint image is deliberately light (python + uv + lint tools only —
# see Makefile). None of the runtime deps (fastapi/pydantic/httpx/mcp) nor the
# prod-only ML stack (torch/numpy/nemo/faster_whisper/faster_qwen3_tts/kokoro/
# onnxruntime) are installed there, so mypy can't resolve their imports.
# Ignore the missing third-party stubs; mypy still type-checks all first-party
# code (our annotations, signatures, return types) against each other.
ignore_missing_imports = true
